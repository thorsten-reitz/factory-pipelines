name: factory-secrets
description: Holt die Secrets einer Umgebung als Umgebungsvariablen für die folgenden Schritte. Standard Infisical per OIDC, ohne gespeicherte Secrets in GitHub.
inputs:
  provider:
    description: "'infisical' (Standard) oder 'test' (nur für die Selbsttests dieses Repos)"
    default: infisical
  environment:
    description: Infisical-Umgebung (Slug), z. B. staging oder production
    required: true
  infisical-project-id:
    description: Infisical-Projekt-ID (GitHub-Variable INFISICAL_PROJECT_ID)
    default: ""
  infisical-identity-id:
    description: ID der Maschinen-Identität mit OIDC-Auth (GitHub-Variable INFISICAL_IDENTITY_ID)
    default: ""
  infisical-domain:
    default: https://eu.infisical.com
  test-secrets:
    description: "Nur provider 'test': JSON-Objekt {\"NAME\": \"wert\"}"
    default: "{}"
runs:
  using: composite
  steps:
    - name: Eingaben prüfen
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        PROJECT_ID: ${{ inputs.infisical-project-id }}
        IDENTITY_ID: ${{ inputs.infisical-identity-id }}
      run: |
        case "$PROVIDER" in
          infisical)
            [ -n "$PROJECT_ID" ] && [ -n "$IDENTITY_ID" ] || {
              echo "::error::Infisical ist nicht eingerichtet: GitHub-Variablen INFISICAL_PROJECT_ID und INFISICAL_IDENTITY_ID fehlen (Repo → Settings → Variables)."
              exit 1; } ;;
          test) ;;
          *) echo "::error::Unbekannter Secrets-Provider: $PROVIDER"; exit 1 ;;
        esac
    - name: Secrets aus Infisical
      if: inputs.provider == 'infisical'
      uses: Infisical/secrets-action@v1.0.12
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-id: ${{ inputs.infisical-project-id }}
        env-slug: ${{ inputs.environment }}
        domain: ${{ inputs.infisical-domain }}
        export-type: env
    - name: Test-Secrets
      if: inputs.provider == 'test'
      shell: bash
      env:
        SECRETS_JSON: ${{ inputs.test-secrets }}
      run: |
        set -euo pipefail
        while IFS= read -r key; do
          value=$(jq -r --arg k "$key" '.[$k]' <<<"$SECRETS_JSON")
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<<"$value"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "$key<<$delim"; printf '%s\n' "$value"; echo "$delim"; } >> "$GITHUB_ENV"
        done < <(jq -r 'keys[]' <<<"$SECRETS_JSON")
