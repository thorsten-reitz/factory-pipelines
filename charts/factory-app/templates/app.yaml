{{- $a := .Values.app }}
apiVersion: v1
kind: Service
metadata:
  name: app
  labels: {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: {{ $a.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ $a.replicas }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        {{- include "factory.labels" . | nindent 8 }}
      annotations:
        factory/commit: {{ .Values.commit | quote }}
    spec:
      {{- include "factory.pullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: {{ include "factory.image" . | quote }}
          {{- with $a.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $a.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          {{- with $a.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Verbindungen sauber auslaufen lassen, bevor der Pod beendet wird
            preStop:
              sleep: { seconds: 5 }
          resources: {{- toYaml $a.resources | nindent 12 }}
          {{- with .Values.volumes }}
          volumeMounts:
            {{- range . }}
            - name: vol-{{ .name }}
              mountPath: {{ .mountPath | default (printf "/data/%s" .name) }}
            {{- end }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- range . }}
        - name: vol-{{ .name }}
          persistentVolumeClaim:
            claimName: {{ .name }}
        {{- end }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  labels: {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    {{- if .Values.ingress.host }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.host }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: app-tls
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
