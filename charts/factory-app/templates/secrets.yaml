{{- if eq .Values.secrets.provider "infisical" }}
{{- $i := .Values.secrets.infisical }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: app-secrets
  labels: {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  infisicalAuthRef:
    name: {{ $i.authRef.name }}
    namespace: {{ $i.authRef.namespace }}
  syncOptions:
    refreshInterval: {{ $i.refreshInterval }}
  sources:
    - projectId: {{ required "secrets.infisical.projectId fehlt (GitHub-Variable INFISICAL_PROJECT_ID)" $i.projectId | quote }}
      environmentSlug: {{ $i.environmentSlug | default .Values.environment | quote }}
      secretPath: {{ $i.secretPath | quote }}
  targets:
    - name: {{ .Values.secrets.name }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
    {{- if $i.pullTokenKey }}
    - name: {{ .Values.image.pullSecret | default "registry-pull" }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: kubernetes.io/dockerconfigjson
      template:
        engineVersion: v1
        data:
          .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"{{ .%s.Value }}\"}}}" $i.pullRegistry ($i.pullUser | default "factory") $i.pullTokenKey | squote }}
    {{- end }}
{{- end }}
