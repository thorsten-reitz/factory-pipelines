{{- if .Values.postgres.enabled }}
{{- $p := .Values.postgres }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $p.service }}
  labels: {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/component: {{ $p.service }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $p.service }}
  labels: {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: {{ $p.service }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $p.service }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $p.service }}
        {{- include "factory.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ $p.image }}
          env:
            - name: POSTGRES_USER
              value: {{ $p.user | quote }}
            - name: POSTGRES_DB
              value: {{ $p.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $p.user | quote }}, "-d", {{ $p.database | quote }}]
            periodSeconds: 5
          resources: {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $p.storage }}
{{- end }}
